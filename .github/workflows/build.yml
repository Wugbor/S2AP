# Prototype build pipeline for S2AP Duckstation Client
# Builds for platforms: Windows, Linux # TODO Mac

name: Build

on:
#   push:
#     branches: ["master"]
#   pull_request:
#     branches: ["master"]
  workflow_dispatch:
  release:
    types: [published]
  
env:
  solution: './source/S2AP/S2AP.sln'
  project: './source/S2AP.Desktop/S2AP.Desktop.csproj'

permissions:
  contents: write

jobs:
  build_s2ap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
          
      - name: Restore dependencies
        run: dotnet restore ${{ env.project }}

      - name: Build
        run: dotnet build ${{ env.project }} --property WarningLevel=0
      
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update && sudo apt-get install -y zip wget file
          mkdir -p dist pub

          # Windows
          dotnet publish ${{ env.project }} -r win-x64 -f net8.0 -c Release --self-contained true -o dist/win-x64

          #Linux
          dotnet publish ${{ env.project }} -r linux-x64 -f net8.0 -c Release --self-contained true -o dist/linux-x64

          # TODO Mac

      - name: Package Windows
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          zip -q -r "../pub/S2AP-desktop-for-windows-x64.zip" win-x64
          #zip -q -r "../pub/S2AP-desktop-for-mac-x64.zip" osx-x64

      - name: Package Linux
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Download appimagetool from new repo
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1

          build_appimage() {
            ARCH=$1
            APPDIR=dist/S2AP-desktop-${ARCH}.AppDir
            rm -rf "$APPDIR"
            mkdir -p "$APPDIR/usr/bin"
            cp -r dist/linux-${ARCH}/* "$APPDIR/usr/bin"
            # TODO custom app icon?
            cp source/S2AP/Assets/archipelago.png "$APPDIR/S2AP.png"

            cat > "$APPDIR/S2AP.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=S2AP Desktop
          Comment=Spyro 2 Archipelago Duckstation Client
          Exec=S2AP.Desktop
          Icon=S2AP
          Type=Application
          Categories=Emulator;
          DESKTOP
            
            cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/S2AP" "$@"
          APPRUN

            chmod +x "$APPDIR/AppRun"

            /tmp/appimagetool --no-appstream "$APPDIR" "pub/S2AP-desktop-for-linux-${ARCH}.AppImage"
          }

          build_appimage x64
      
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pub/*.*
